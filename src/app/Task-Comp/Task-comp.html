<div class="container mt-4">
  <div class="card shadow-sm">
    <div class="card-header bg-primary text-white">
      <h5 class="mb-0">➕ Add New Task</h5>
    </div>
    <div class="card-body">
      @if (error.state) {
        <div class="alert alert-danger py-2">{{ error.message }}</div>
      }
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label">Task Title</label>
          <input
            type="text"
            class="form-control"
            placeholder="Enter task title"
            [(ngModel)]="task.title"
          />
        </div>
        <div class="col-md-6">
          <label class="form-label">Description</label>
          <input
            type="text"
            class="form-control"
            placeholder="Enter task description"
            [(ngModel)]="task.description"
          />
        </div>
        <div class="col-md-4">
          <label class="form-label">Priority</label>
          <select class="form-select" [(ngModel)]="task.priority">
            <option value="">-- Select --</option>
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high">High</option>
          </select>
        </div>
        <div class="col-md-4">
          <label class="form-label">Due Date</label>
          <input type="date" class="form-control" [(ngModel)]="task.dueDate" />
        </div>
        <div class="col-md-4">
          <label class="form-label">Category</label>
          <select class="form-select" [(ngModel)]="task.Category">
            <option value="">-- Select --</option>
            <option value="work">Work</option>
            <option value="personal">Personal</option>
            <option value="study">Study</option>
          </select>
        </div>
        <div class="col-12">
          <label class="form-label">Tags <small class="text-muted">(comma separated)</small></label>
          <input
            type="text"
            class="form-control"
            placeholder="e.g. urgent, frontend"
            [(ngModel)]="task.tags"
          />
        </div>
        <div class="col-12">
          <button class="btn btn-primary px-4" (click)="addTask()">Add Task</button>
        </div>
      </div>
    </div>
  </div>
</div>
