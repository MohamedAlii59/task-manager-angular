<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3 class="mb-0 fw-bold text-primary">📋 Task List</h3>
  </div>

  <ul class="nav nav-tabs mb-4">
    <li class="nav-item">
      <button class="nav-link" [class.active]="tab() === 'all'" (click)="tab.set('all')">
        All <span class="badge bg-secondary ms-1">{{ tasksService.tasks().length }}</span>
      </button>
    </li>
    <li class="nav-item">
      <button class="nav-link" [class.active]="tab() === 'done'" (click)="tab.set('done')">
        Done <span class="badge bg-success ms-1">{{ tasksService.doneTasks().length }}</span>
      </button>
    </li>
    <li class="nav-item">
      <button class="nav-link" [class.active]="tab() === 'not-done'" (click)="tab.set('not-done')">
        Pending <span class="badge bg-warning text-dark ms-1">{{ tasksService.notDoneTasks().length }}</span>
      </button>
    </li>
  </ul>

  @if (visibleTasks().length === 0) {
    <div class="text-center py-5 text-muted">
      <p class="fs-5">
        @if (tab() === 'all') { No tasks yet. Head to Add Task to create one! }
        @else if (tab() === 'done') { No completed tasks yet. }
        @else { No pending tasks. Great job! 🎉 }
      </p>
    </div>
  } @else {
    @for (task of visibleTasks(); track task.id) {
      <Task-card [task]="task" />
    }
  }
</div>
