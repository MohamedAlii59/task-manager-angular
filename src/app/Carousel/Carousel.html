<div class="container">
  <div class="carousel-box">
    <button class="prev" (click)="prev()">&#10094;</button>

    <img [src]="index + '.jpg'" />

    <button class="next" (click)="next()">&#10095;</button>
  </div>

  <div class="dots">
    @for (item of arr; track $index) {
      <span class="dot" [class.active]="index === item" (click)="goToSlide(item)"></span>
    }
  </div>
  <div>
    <!-- <button class="slideshow" (click)="startAutoSlide()">Start slideshow</button>
    <button class="stop" (click)="resetAutoSlide()">Stop</button> -->
  </div>
</div>
